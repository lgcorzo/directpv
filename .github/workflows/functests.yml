name: Functional Tests

on:
  push:
    branches: [ master, devel ]

  pull_request:
    branches: [ master, devel ]

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testing on Kubernetes ${{ matrix.kube-version }} in ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kube-version: ['v1.28.15', 'v1.29.14', 'v1.30.14', 'v1.31.14', 'v1.32.13', 'v1.33.9', 'v1.34.5', 'v1.35.2']
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Generate default containerd config with CRI enabled (disabled_plugins = [])
          sudo mkdir -p /etc/containerd
          containerd config default | sudo tee /etc/containerd/config.toml
          sudo systemctl restart containerd
          sudo crictl version || true

      - name: Set environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          mkdir -p "$(go env GOPATH)/src/github.com/lgcorzo/"
          ln -s "$PWD" "$(go env GOPATH)/src/github.com/lgcorzo/directpv"
          echo "VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_ENV
          # To Fix: chmod: cannot access '/etc/cni/net.d': No such file or directory
          sudo mkdir -p /etc/cni/net.d

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
        run: |
          go build -tags "osusergo netgo static_build" -ldflags="-X main.Version=${VERSION} -extldflags=-static" github.com/lgcorzo/directpv/cmd/directpv
          go build -tags "osusergo netgo static_build" -ldflags="-X main.Version=${VERSION} -extldflags=-static" github.com/lgcorzo/directpv/cmd/kubectl-directpv

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          # Driver none is required so DirectPV can discover host loop/LVM/LUKS devices
          driver: none
          kubernetes-version: ${{ matrix.kube-version }}

      - name: Check Minikube
        run: |
          kubectl get nodes
          kubectl get pods -A
          while kubectl get pods -n kube-system --no-headers | grep -vqw Running; do echo "Waiting for Minikube pods to be ready"; sleep 3; done
          while kubectl get nodes --no-headers | grep -vqw Ready; do echo "Waiting for Minikube node to be ready"; sleep 3; done

      - name: Build docker image
        run: |
          docker build --quiet -t quay.io/lgcorzo/directpv:${VERSION} .
          docker build --quiet -t example.org/test/sleep:v0.0.1 -f functests/Dockerfile.sleep functests
          # Ensure images are available to both docker and containerd k8s.io namespace
          docker save quay.io/lgcorzo/directpv:${VERSION} | sudo ctr -n k8s.io images import - || true
          docker save example.org/test/sleep:v0.0.1 | sudo ctr -n k8s.io images import - || true

      - name: Enable kustomize
        if: contains(fromJson('["v1.28.15", "v1.29.14"]'), matrix.kube-version)
        run: |
          echo "KUSTOMIZE=true" >> $GITHUB_ENV

      - name: Run tests
        run: |
          functests/run-tests.sh

      - name: Run migration tests with DirectCSI v3.2.2
        run: |
          sudo rm -fr /var/lib/directpv
          functests/run-migration-tests.sh "v3.2.2"
